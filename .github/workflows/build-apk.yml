name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Signed CS2 Case Simulator APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project (Expo Prebuild)
        env:
          EXPO_NO_GIT_STATUS: 1
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Release APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align and Sign APK with Android v1 + v2 + v3 Signatures
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
          keytool -genkeypair -v -storetype PKCS12 -keystore cs2-release.keystore -alias cs2-key -keyalg RSA -keysize 2048 -validity 10000 -storepass cs2simulator -keypass cs2simulator -dname "CN=CS2Drop, OU=Mobile, O=CS2Drop, L=Almaty, S=KZ, C=KZ"
          RAW_APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          $ZIPALIGN -v -p 4 "$RAW_APK" aligned.apk
          $APKSIGNER sign --ks cs2-release.keystore --ks-pass pass:cs2simulator --key-pass pass:cs2simulator --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out CS2-Case-Simulator.apk aligned.apk
          $APKSIGNER verify -v CS2-Case-Simulator.apk
          cp CS2-Case-Simulator.apk CS2-Case-Simulator-v2.2.apk

      - name: Upload Ready APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS2-Case-Simulator-APK
          path: ./CS2-Case-Simulator.apk

      - name: Publish Signed APK to GitHub Releases (v2.2.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.2.0 --yes || true
          gh release create v2.2.0 ./CS2-Case-Simulator.apk ./CS2-Case-Simulator-v2.2.apk \
            --title "CS2 Case Simulator v2.2 (Floating Glass Nav, Big Roulette, Auto-Open, Auto-Sell & Official Agents)" \
            --notes "Обновление v2.2: Парящее Liquid Glass меню (4 вкладки), Увеличенный барабан рулетки и скины, Два тумблера: Авто-открытие и Авто-продажа по качеству, Официальные модельки агентов CS2, Перенос профиля и настроек в шапку."
          gh release upload v2.1.0 ./CS2-Case-Simulator.apk --clobber || true
